<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#10151c;
    color:#ffffff;
}

/* NAVIGATION */

nav{
    height:82px;
    background:#ffffff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 8%;
}

.logo{
    color:#111827;
    font-family:Georgia,serif;
    font-size:28px;
    font-weight:bold;
}

.logo span{
    display:block;
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:4px;
    color:#b8903e;
    margin-top:6px;
}

.nav-links{
    display:flex;
    gap:34px;
}

.nav-links a{
    color:#111827;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
}

.nav-links a:hover{
    color:#b8903e;
}

/* HERO */

.hero{
    text-align:center;
    padding:90px 20px 55px;
    background:
    linear-gradient(rgba(10,15,22,.88),rgba(10,15,22,.96)),
    url("supreme court.webp") center/cover no-repeat;
}

.hero small{
    color:#d2a94b;
    letter-spacing:5px;
    font-weight:bold;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:55px;
    margin:18px 0 12px;
}

.hero p{
    color:#cbd5e1;
    font-size:17px;
}

/* GALLERY */

.gallery-section{
    max-width:1200px;
    margin:auto;
    padding:70px 25px 90px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.photo{
    position:relative;
    height:360px;
    overflow:hidden;
    border:1px solid #3a4350;
    background:#1c232d;
    border-radius:4px;
    cursor:pointer;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s ease;
}

.photo:hover img{
    transform:scale(1.06);
}

.photo-title{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:22px 18px;
    background:linear-gradient(transparent,rgba(0,0,0,.9));
    font-family:Georgia,serif;
    font-size:20px;
}

/* SUPREME COURT */

.supreme{
    grid-column:1 / -1;
    height:430px;
}

.supreme img{
    object-position:center;
}

/* FOOTER */

footer{
    background:#080c11;
    text-align:center;
    padding:30px 20px;
    color:#9ca3af;
    border-top:1px solid #29313c;
}

footer strong{
    color:#ffffff;
}

/* MOBILE */

@media(max-width:800px){

    nav{
        height:auto;
        padding:20px;
        flex-direction:column;
        gap:20px;
    }

    .nav-links{
        gap:18px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero{
        padding:65px 20px 45px;
    }

    .hero h1{
        font-size:40px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .photo,
    .supreme{
        height:360px;
        grid-column:auto;
    }
}

</style>
</head>
