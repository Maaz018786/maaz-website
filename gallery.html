<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Maaz Legal Associates</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f0df;
    color: #20242b;
}

header {
    background: #101722;
    color: white;
    padding: 24px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 30px;
    font-weight: bold;
}

.hero {
    background: #101722;
    color: white;
    text-align: center;
    padding: 55px 20px;
    border-top: 1px solid #b99345;
}

.hero h1 {
    font-family: Georgia, serif;
    font-size: 48px;
    margin-bottom: 12px;
}

.hero p {
    color: #d8c28e;
    font-size: 17px;
}

.gallery {
    max-width: 1200px;
    margin: 55px auto;
    padding: 0 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.photo {
    background: white;
    border: 1px solid #ddd3b8;
    box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    overflow: hidden;
}

.photo img {
    display: block;
    width: 100%;
    height: 330px;
    object-fit: cover;
}

.caption {
    padding: 17px;
    text-align: center;
    font-family: Georgia, serif;
    font-size: 18px;
    font-weight: bold;
}

footer {
    background: #101722;
    color: white;
    text-align: center;
    padding: 30px;
    margin-top: 50px;
}

@media (max-width: 800px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero h1 {
        font-size: 38px;
    }
}

@media (max-width: 550px) {
    header {
        flex-direction: column;
        gap: 18px;
    }

    nav a {
        margin: 0 8px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Maaz Legal Associates</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Gallery</h1>
    <p>Professional moments, legal practice and appearances.</p>
</section>

<section class="gallery">

    <div class="photo">
        <img src="advocate%20%281%29.png" alt="Advocate Maaz Ullah">
        <div class="caption">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="advocate%20%282%29.jpg" alt="Advocate Maaz Ullah">
        <div class="caption">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="advocate%20%284%29.png" alt="Advocate Maaz Ullah">
        <div class="caption">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="advocate%20%288%29.jpg" alt="Advocate Maaz Ullah">
        <div class="caption">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="advocate%20%289%29.png" alt="Advocate Maaz Ullah">
        <div class="caption">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="supreme%20court.webp" alt="Supreme Court">
        <div class="caption">Supreme Court</div>
    </div>

</section>

<footer>
    © 2026 Maaz Legal Associates. All Rights Reserved.
</footer>

</body>
</html>
