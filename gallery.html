<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Advocate Maaz Ullah</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#0d1b2a;
    color:white;
}

nav{
    background:#ffffff;
    padding:22px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#0d1b2a;
    font-family:Georgia, serif;
    font-size:27px;
    font-weight:bold;
}

.logo span{
    display:block;
    color:#b88932;
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:4px;
    margin-top:7px;
}

.nav-links{
    display:flex;
    gap:35px;
}

.nav-links a{
    color:#111;
    text-decoration:none;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:75px 20px 45px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:55px;
    margin-bottom:15px;
}

.hero p{
    color:#d8d8d8;
    font-size:17px;
}

.line{
    width:70px;
    height:3px;
    background:#c49a45;
    margin:25px auto;
}

.gallery{
    width:90%;
    max-width:1200px;
    margin:20px auto 80px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.photo{
    background:#172536;
    border:1px solid rgba(196,154,69,.5);
    overflow:hidden;
    min-height:280px;
    position:relative;
}

.photo img{
    width:100%;
    height:280px;
    object-fit:cover;
    display:block;
}

.photo-title{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:18px;
    background:linear-gradient(transparent,rgba(0,0,0,.9));
    font-family:Georgia,serif;
    font-size:19px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    background:#08131f;
    color:#aaa;
}

@media(max-width:800px){
    .gallery{
        grid-template-columns:1fr 1fr;
    }

    .hero h1{
        font-size:40px;
    }
}

@media(max-width:550px){
    nav{
        padding:18px 5%;
    }

    .nav-links{
        gap:12px;
        font-size:13px;
    }

    .gallery{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        Maaz Ullah
        <span>ADVOCATE</span>
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<section class="hero">
    <h1>Professional Gallery</h1>
    <div class="line"></div>
    <p>Advocate Maaz Ullah · Lucknow</p>
</section>

<div class="gallery">

    <div class="photo">
        <img src="./advocate%20(1).png" alt="Advocate Maaz Ullah">
        <div class="photo-title">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="./advocate%20(2).jpg" alt="Advocate Maaz Ullah">
        <div class="photo-title">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="./advocate%20(4).png" alt="Advocate Maaz Ullah">
        <div class="photo-title">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="./advocate%20(8).jpg" alt="Advocate Maaz Ullah">
        <div class="photo-title">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="./advocate%20(9).png" alt="Advocate Maaz Ullah">
        <div class="photo-title">Advocate Maaz Ullah</div>
    </div>

    <div class="photo">
        <img src="./supreme%20court.webp" alt="Supreme Court">
        <div class="photo-title">Supreme Court</div>
    </div>

</div>

<footer>
    © 2026 Advocate Maaz Ullah · All Rights Reserved
</footer>

</body>
</html>
